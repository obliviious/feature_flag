version: "3.9"

services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
    environment:
      DATABASE_URL: sqlite:///data/flagforge.db?mode=rwc
      REDIS_URL: redis://redis:6379
      CLERK_DOMAIN: ${CLERK_DOMAIN:?CLERK_DOMAIN must be set}
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  sqlite_data:
